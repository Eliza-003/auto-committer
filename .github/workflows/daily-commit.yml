name: Daily commit

on:
  schedule:
    # GitHub can delay or drop scheduled runs during high load, so try three
    # times a day. The script is idempotent: the first run that commits wins,
    # later runs see today's date already logged and exit without a commit.
    # GitHub cron uses UTC.
    - cron: "17 6 * * *"
    - cron: "17 12 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-commit
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Re-runs check out the original run SHA by default. Use the
          # current tip so the script sees lines pushed by earlier attempts.
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Commit today's entry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/daily_commit.py
          git push
